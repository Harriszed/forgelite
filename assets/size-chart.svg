<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">How much smaller Forge is</title>
  <desc id="d">Forge compared with Superpowers 7.0.0, with Superpowers as 100 percent: 40 percent of the skills, 5 percent of the instruction lines, 10 percent of the session-start text.</desc>
  <rect width="800" height="330" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="32" y="44" font-size="20" font-weight="700" fill="#111827">What your agent has to carry</text>
  <text x="32" y="66" font-size="13" fill="#6b7280">Forge as a share of Superpowers 7.0.0 (Superpowers = 100%).</text>
  <g font-size="14" fill="#374151">
    <text x="32" y="124">Skills</text><text x="32" y="142" font-size="12" fill="#6b7280">6 vs 15</text>
    <text x="32" y="188">Instruction lines</text><text x="32" y="206" font-size="12" fill="#6b7280">199 vs 3,828</text>
    <text x="32" y="252">Session-start text</text><text x="32" y="270" font-size="12" fill="#6b7280">320 vs ~3,200 chars</text>
  </g>
  <g fill="#e5e7eb">
    <rect x="190" y="104" width="520" height="40" rx="6"/>
    <rect x="190" y="168" width="520" height="40" rx="6"/>
    <rect x="190" y="232" width="520" height="40" rx="6"/>
  </g>
  <rect x="190" y="104" width="208" height="40" rx="6" fill="#eb6834"/>
  <rect x="190" y="168" width="27" height="40" rx="6" fill="#eb6834"/>
  <rect x="190" y="232" width="52" height="40" rx="6" fill="#eb6834"/>
  <g font-size="16" font-weight="700" fill="#111827">
    <text x="410" y="130">40%</text>
    <text x="229" y="194">5%</text>
    <text x="254" y="258">10%</text>
  </g>
  <text x="32" y="308" font-size="11" fill="#6b7280">Skill text is loaded into the agent's context when a skill triggers, and the session-start text is loaded every session.</text>
</svg>
