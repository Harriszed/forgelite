<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">The Forgelite workflow</title>
  <desc id="d">Shape runs in an Opus session with a Sonnet spec review. Planning runs in a fresh Opus session that reads the spec, with an Opus plan review. Building runs in fresh Sonnet sessions of up to 8 tasks each, with Sonnet subagents, then a final Opus review, verification and finishing.</desc>
  <rect width="960" height="300" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="32" y="40" font-size="20" font-weight="700" fill="#111827">Thinking on Opus, building on Sonnet, a fresh chat for each stage</text>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#9ca3af"/></marker></defs>

  <rect x="24" y="64" width="190" height="180" rx="10" fill="#fff7ed" stroke="#fdba74"/>
  <text x="40" y="88" font-size="12" font-weight="700" fill="#9a3412">SESSION 1 · OPUS</text>
  <rect x="230" y="64" width="190" height="180" rx="10" fill="#fff7ed" stroke="#fdba74"/>
  <text x="246" y="88" font-size="12" font-weight="700" fill="#9a3412">SESSION 2 · OPUS</text>
  <text x="246" y="102" font-size="10" fill="#9a3412">new chat, reads the spec</text>
  <rect x="436" y="64" width="500" height="180" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="452" y="88" font-size="12" font-weight="700" fill="#991b1b">SESSION 3+ · SONNET</text>
  <text x="452" y="102" font-size="10" fill="#991b1b">new chat, reads the plan; a fresh chat every 8 tasks, with a progress note</text>

  <g font-size="15" font-weight="700" fill="#111827" text-anchor="middle">
    <rect x="44" y="114" width="150" height="60" rx="8" fill="#ffffff" stroke="#fb923c"/><text x="119" y="140">shape</text><text x="119" y="159" font-size="12" font-weight="400" fill="#6b7280">interview → spec</text>
    <rect x="250" y="114" width="150" height="60" rx="8" fill="#ffffff" stroke="#fb923c"/><text x="325" y="140">plan</text><text x="325" y="159" font-size="12" font-weight="400" fill="#6b7280">tasks → plan file</text>
    <rect x="452" y="114" width="140" height="60" rx="8" fill="#ffffff" stroke="#ef4444"/><text x="522" y="140">build</text><text x="522" y="159" font-size="12" font-weight="400" fill="#6b7280">test-first, batches of 8</text>
    <rect x="616" y="114" width="140" height="60" rx="8" fill="#ffffff" stroke="#ef4444"/><text x="686" y="140">review</text><text x="686" y="159" font-size="12" font-weight="400" fill="#6b7280">fix real findings</text>
    <rect x="780" y="114" width="140" height="60" rx="8" fill="#ffffff" stroke="#ef4444"/><text x="850" y="140">verify + finish</text><text x="850" y="159" font-size="12" font-weight="400" fill="#6b7280">proof, then ship</text>
  </g>
  <g stroke="#9ca3af" stroke-width="2" marker-end="url(#a)"><path d="M194 144H246"/><path d="M400 144H448"/><path d="M592 144H612"/><path d="M756 144H776"/></g>

  <g font-size="11" font-weight="700" text-anchor="middle">
    <rect x="56" y="190" width="126" height="34" rx="6" fill="#ffedd5"/><text x="119" y="204" fill="#9a3412">cold review: Sonnet</text><text x="119" y="217" font-weight="400" fill="#9a3412">spec</text>
    <rect x="262" y="190" width="126" height="34" rx="6" fill="#ffedd5"/><text x="325" y="204" fill="#9a3412">cold review: Opus</text><text x="325" y="217" font-weight="400" fill="#9a3412">plan size, overlaps</text>
    <rect x="459" y="190" width="126" height="34" rx="6" fill="#fee2e2"/><text x="522" y="204" fill="#991b1b">subagents: Sonnet</text><text x="522" y="217" font-weight="400" fill="#991b1b">Opus only for risky tasks</text>
    <rect x="623" y="190" width="126" height="34" rx="6" fill="#fee2e2"/><text x="686" y="204" fill="#991b1b">final review: Opus</text><text x="686" y="217" font-weight="400" fill="#991b1b">high effort, automatic</text>
    <rect x="787" y="190" width="126" height="34" rx="6" fill="#fee2e2"/><text x="850" y="204" fill="#991b1b">real command output</text><text x="850" y="217" font-weight="400" fill="#991b1b">you choose how to ship</text>
  </g>
  <text x="32" y="270" font-size="11" fill="#6b7280">Each new chat reloads the project once, which is cheaper than carrying a long chat: every message in a chat re-reads everything said before it.</text>
  <text x="32" y="286" font-size="11" fill="#6b7280">Risky tasks are database migrations, security and payments, named with a reason in the plan.</text>
</svg>
