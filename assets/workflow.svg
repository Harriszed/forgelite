<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">The Forge workflow</title>
  <desc id="d">Shape and plan run on Opus in one session, with reviews. Build runs in a new Sonnet session with Sonnet and Haiku subagents. A final Opus review checks the diff before verification.</desc>
  <rect width="800" height="280" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="32" y="40" font-size="20" font-weight="700" fill="#111827">Thinking on Opus, building on Sonnet</text>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#9ca3af"/></marker></defs>
  <rect x="24" y="64" width="372" height="170" rx="10" fill="#fff7ed" stroke="#fdba74"/>
  <text x="40" y="88" font-size="13" font-weight="700" fill="#9a3412">SESSION 1 · OPUS</text>
  <rect x="404" y="64" width="372" height="170" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="420" y="88" font-size="13" font-weight="700" fill="#991b1b">SESSION 2 · SONNET (new chat, reads the plan file)</text>
  <g font-size="15" font-weight="700" fill="#111827" text-anchor="middle">
    <rect x="40" y="110" width="150" height="64" rx="8" fill="#ffffff" stroke="#fb923c"/><text x="115" y="138">shape</text><text x="115" y="158" font-size="12" font-weight="400" fill="#6b7280">interview → spec</text>
    <rect x="230" y="110" width="150" height="64" rx="8" fill="#ffffff" stroke="#fb923c"/><text x="305" y="138">plan</text><text x="305" y="158" font-size="12" font-weight="400" fill="#6b7280">tasks → plan file</text>
    <rect x="420" y="110" width="150" height="64" rx="8" fill="#ffffff" stroke="#ef4444"/><text x="495" y="138">build</text><text x="495" y="158" font-size="12" font-weight="400" fill="#6b7280">test-first, in parallel</text>
    <rect x="610" y="110" width="150" height="64" rx="8" fill="#ffffff" stroke="#ef4444"/><text x="685" y="138">verify</text><text x="685" y="158" font-size="12" font-weight="400" fill="#6b7280">evidence, then done</text>
  </g>
  <g stroke="#9ca3af" stroke-width="2" marker-end="url(#a)"><path d="M190 142H226"/><path d="M380 142H416"/><path d="M570 142H606"/></g>
  <g font-size="11" font-weight="700" text-anchor="middle">
    <rect x="52" y="188" width="126" height="32" rx="6" fill="#ffedd5"/><text x="115" y="202" fill="#9a3412">cold review: Sonnet</text><text x="115" y="214" font-weight="400" fill="#9a3412">spec</text>
    <rect x="242" y="188" width="126" height="32" rx="6" fill="#ffedd5"/><text x="305" y="202" fill="#9a3412">cold review: Opus</text><text x="305" y="214" font-weight="400" fill="#9a3412">plan, high effort</text>
    <rect x="432" y="188" width="126" height="32" rx="6" fill="#fee2e2"/><text x="495" y="202" fill="#991b1b">subagents: Sonnet</text><text x="495" y="214" font-weight="400" fill="#991b1b">Haiku for mechanical</text>
    <rect x="622" y="188" width="126" height="32" rx="6" fill="#fee2e2"/><text x="685" y="202" fill="#991b1b">final review: Opus</text><text x="685" y="214" font-weight="400" fill="#991b1b">high effort</text>
  </g>
  <text x="32" y="262" font-size="11" fill="#6b7280">A fresh session means nothing has to be re-cached: switching model mid-chat re-reads the whole conversation at full price.</text>
</svg>
